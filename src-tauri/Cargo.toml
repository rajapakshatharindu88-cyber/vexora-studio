[package]
name = "vexora-studio"
version = "1.0.0"
version = "0.1.0"
description = "VEXORA Studio desktop application"
authors = []
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2" }

